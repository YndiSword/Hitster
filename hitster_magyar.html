<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hitster</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #14121f; color: #f2eefc; }
  main { max-width: 720px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.5rem; margin: 8px 0 16px; }
  h2 { font-size: 1.15rem; margin: 0 0 10px; }
  button { font: inherit; border: 0; border-radius: 10px; padding: 12px 18px; min-height: 48px;
           background: #e8467c; color: #fff; font-weight: 600; cursor: pointer; }
  button.ghost { background: #2c2840; color: #f2eefc; }
  button:disabled { opacity: .4; cursor: default; }
  input { font: inherit; padding: 10px; border-radius: 8px; border: 1px solid #443d63; background: #1e1b2e; color: inherit; width: 100%; }
  label { display: block; margin: 10px 0 4px; color: #b9b2d6; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .panel { background: #1e1b2e; border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .hidden { display: none !important; }
  .muted { color: #9a93b8; font-size: .9rem; }

  /* takarékos: a lejátszó láthatatlanul a lap alján ül (200×200 a YouTube minimuma), a saját gomb vezérli. */
  .player { position: fixed; right: 0; bottom: 0; width: 200px; height: 200px; opacity: 0.01; pointer-events: none; z-index: -1; }
  .player iframe { width: 100%; height: 100%; border: 0; }
  .missed .card { background: #ffb3b3; }

  .timeline { display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px; }
  .card { width: 104px; min-height: 104px; padding: 8px; border-radius: 10px; background: #f6c945; color: #1b1630;
          display: flex; flex-direction: column; justify-content: center; text-align: center; }
  .card b { font-size: 1.5rem; }
  .card.start { background: #fff3c4; outline: 4px solid #4fc3f7; outline-offset: -4px; }
  .card .tag { font-size: .65rem; font-weight: 700; text-transform: uppercase; color: #1976a8; }
  .card small { font-size: .72rem; line-height: 1.2; }
  .slot { width: 34px; min-height: 104px; padding: 0; border-radius: 10px; background: #2c2840; border: 2px dashed #5a5180; color: #b9b2d6; font-size: 1.3rem; }
  .slot.sel { background: #e8467c; border-color: #e8467c; color: #fff; }

  .reveal { font-size: 1.1rem; line-height: 1.5; }
  .ok { color: #6be39a; } .bad { color: #ff7b7b; }
  .scores { display: flex; gap: 8px; flex-wrap: wrap; }
  .scores span { background: #2c2840; padding: 6px 10px; border-radius: 8px; font-size: 1rem; }
  .final { font-size: 1.3rem; line-height: 1.6; }
</style>
</head>
<body>
<main>
  <h1>Hitster</h1>

  <!-- BEÁLLÍTÁS -->
  <section id="setup" class="panel">
    <h2>Szóló játék</h2>
    <p>Kapsz egy felfordított kezdőkártyát, utána 10 dalt kell az idővonaladon a helyére tenned. Számít, hány sikerül, és mennyi idő alatt.</p>
    <label for="packSel">Pakli</label>
    <select id="packSel" style="font:inherit;padding:10px;border-radius:8px;border:1px solid #443d63;background:#1e1b2e;color:inherit;width:100%">
      <option value="hu">Magyar kiadás</option>
      <option value="int">Nemzetközi (angol nyelvű)</option>
      <option value="mix">Vegyes (mindkettő)</option>
    </select>
    <p id="record" class="muted"></p>
    <div class="row">
      <button id="startBtn">Új játék</button>
      <button id="resumeBtn" class="ghost hidden">Mentett játék folytatása</button>
    </div>
    <p class="muted" id="packInfo"></p>
  </section>

  <!-- JÁTÉK -->
  <section id="game" class="hidden">
    <div class="panel">
      <div class="scores" id="scores"></div>
    </div>

    <div class="panel">
      <h2 id="turnTitle"></h2>
      <div class="row">
        <button id="playBtn">▶ Lejátszás</button>
        <button id="skipBtn" class="ghost">Másik dal</button>
      </div>
      <div id="missedBox" class="hidden">
        <h2 style="margin-top:16px">Nem talált dalok</h2>
        <div class="timeline missed" id="missed"></div>
      </div>
    </div>
    <div class="player"><div id="yt"></div></div>

    <div class="panel">
      <h2>Idővonal</h2>
      <p class="muted" id="hint">Koppints arra a résre, ahová szerinted a dal tartozik.</p>
      <div class="timeline" id="timeline"></div>
      <div class="row">
        <button id="revealBtn" disabled>Felfedés</button>
      </div>
      <div id="result" class="reveal hidden"></div>
      <div class="row">
        <button id="nextBtn" class="hidden">Következő dal</button>
      </div>
    </div>

    <div class="row"><button id="quitBtn" class="ghost">Kilépés a menübe</button></div>
  </section>
</main>

  if (pack !== 'mix') return SONGS.filter(s => s.pack === pack);
  const seen = new Set();
  return SONGS.filter(s => !seen.has(songKey(s)) && seen.add(songKey(s)));
}
const byNum = n => SONGS.find(s => s.n === n);

const SAVE_KEY = 'hitster-hu-szolo';
const recordKey = pack => pack === 'hu' ? 'hitster-hu-rekord' : 'hitster-rekord-' + pack;
const ROUNDS = 10;
// G = { start, cards:[n], deck:[n], round, hits, current, slot, revealed, started, elapsed(ms), done }
let G = null;
let lastTick = 0;

// YouTube IFrame API: ebből tudjuk meg, mikor szólal meg a dal.
let player = null, ytReady = false, loadedId = null;
window.onYouTubeIframeAPIReady = () => { ytReady = true; if (G && !G.done && !$('game').classList.contains('hidden')) render(); };
(() => { const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s); })();

function playSong(id) {
  if (!ytReady || loadedId === id) return;
  loadedId = id;
  if (player) { player.loadVideoById(id); return; }
  player = new YT.Player('yt', {
    videoId: id,
    playerVars: { autoplay: 1, playsinline: 1, rel: 0 },
    events: { onStateChange: e => {
      if (e.data === YT.PlayerState.PLAYING) startClock();
      $('playBtn').textContent = e.data === YT.PlayerState.PLAYING ? '⏸ Szünet' : '▶ Lejátszás';
    } }
  });
}
function stopSong() { try { player && player.stopVideo(); } catch (e) {} loadedId = null; }

// Az óra az első megszólalástól a felfedésig megy.
function startClock() {
  if (!G || G.done || G.revealed || G.started) return;
  G.started = true;
  lastTick = Date.now();
}

const $ = id => document.getElementById(id);
const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
const sortedCards = () => G.cards.map(byNum).sort((a, b) => a.year - b.year);
const fmt = ms => { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

function readJSON(key) { try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; } }
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch (e) {} }
function load() {
  const g = readJSON(SAVE_KEY);
  return g && Array.isArray(g.cards) && Array.isArray(g.deck) && !g.done ? g : null;
}

// Jobb-e az új eredmény: több találat, egyenlőnél rövidebb idő.
const isBetter = (a, b) => !b || a.hits > b.hits || (a.hits === b.hits && a.elapsed < b.elapsed);

// Jó-e a hely: a rés előtti kártya nem későbbi, a rés utáni nem korábbi (azonos év mindkét oldalon jó).
function isCorrect(cards, slot, year) {
  const before = cards[slot - 1], after = cards[slot];
  return (!before || before.year <= year) && (!after || year <= after.year);
}

function newGame() {
  const pack = $('packSel').value;
  try { localStorage.setItem('hitster-pakli', JSON.stringify(pack)); } catch (e) {}
  const deck = shuffle(packPool(pack).map(s => s.n));
  const start = deck.pop();
  G = { pack, start, cards: [start], missed: [], deck, round: 1, hits: 0, elapsed: 0, done: false };
  drawCard();
  show();
}

function drawCard() {
  G.current = G.deck.pop();
  if ($('playBtn')) $('playBtn').textContent = '▶ Lejátszás';
  G.slot = null; G.revealed = false; G.started = false;
  lastTick = Date.now();
  save();
}

function show() {
  $('setup').classList.add('hidden');
  $('game').classList.remove('hidden');
  lastTick = Date.now();
  render();
}

// Az óra csak akkor megy, ha a dal már elindult, még nincs felfedve, és látszik a játék.
function tick() {
  const now = Date.now();
  if (G && !G.done && G.started && !G.revealed && !$('game').classList.contains('hidden') && !document.hidden) {
    G.elapsed += now - lastTick;
    $('scores').innerHTML = statusHTML();
  }
  lastTick = now;
}
setInterval(tick, 500);
setInterval(() => { if (G && !G.done) save(); }, 5000);
document.addEventListener('visibilitychange', () => { lastTick = Date.now(); });

const statusHTML = () =>
  `<span>${PACK_NAMES[G.pack || 'hu']}</span><span>Dal: ${Math.min(G.round, ROUNDS)}/${ROUNDS}</span><span>Talált: ${G.hits}</span><span>⏱ ${fmt(G.elapsed)}</span>`;

function render() {
  $('scores').innerHTML = statusHTML();
  renderMissed();
  $('playBtn').disabled = G.done;

  if (G.done) {
    const rec = readJSON(recordKey(G.pack || 'hu'));
    $('turnTitle').textContent = 'Vége!';
    stopSong();
    $('hint').classList.add('hidden');
    $('revealBtn').classList.add('hidden');
    $('skipBtn').disabled = true;
    $('result').classList.remove('hidden');
    $('result').innerHTML = `<div class="final"><b>${G.hits}/${ROUNDS}</b> találat, <b>${fmt(G.elapsed)}</b> alatt.<br>
      ${G.newRecord ? '🏆 Új rekord!' : rec ? `Rekord: ${rec.hits}/${ROUNDS}, ${fmt(rec.elapsed)}` : ''}</div>`;
    $('nextBtn').textContent = 'Új játék';
    $('nextBtn').classList.remove('hidden');
    renderTimeline(true);
    return;
  }

  $('turnTitle').textContent = `${G.round}. dal`;
  const song = byNum(G.current);
  playSong(song.yt);

  renderTimeline(G.revealed);
  $('hint').classList.toggle('hidden', G.revealed);
  $('revealBtn').classList.toggle('hidden', G.revealed);
  $('revealBtn').disabled = G.slot === null;
  $('skipBtn').disabled = G.revealed;
  $('nextBtn').textContent = G.round >= ROUNDS ? 'Eredmény' : 'Következő dal';
  $('nextBtn').classList.toggle('hidden', !G.revealed);
  $('result').classList.toggle('hidden', !G.revealed);
}

function renderMissed() {
  const missed = (G.missed || []).map(byNum);
  $('missedBox').classList.toggle('hidden', !missed.length);
  $('missed').innerHTML = missed.map(s =>
    `<div class="card"><b>${s.year}</b><small>${s.artist}</small><small><i>${s.title}</i></small></div>`).join('');
}

function renderTimeline(noSlots) {
  const cards = sortedCards();
  let html = '';
  for (let i = 0; i <= cards.length; i++) {
    if (!noSlots) html += `<button class="slot ${G.slot === i ? 'sel' : ''}" data-slot="${i}">+</button>`;
    const isStart = i < cards.length && cards[i].n === G.start;
    if (i < cards.length) html += `<div class="card ${isStart ? 'start' : ''}">${isStart ? '<span class="tag">kezdő</span>' : ''}<b>${cards[i].year}</b><small>${cards[i].artist}</small><small><i>${cards[i].title}</i></small></div>`;
  }
  $('timeline').innerHTML = html;
}

function reveal() {
  tick();
  const song = byNum(G.current);
  const ok = isCorrect(sortedCards(), G.slot, song.year);
  if (ok) { G.cards.push(song.n); G.hits++; } else G.missed.push(song.n);
  G.revealed = true;
  $('result').innerHTML =
    `<div class="${ok ? 'ok' : 'bad'}"><b>${ok ? 'Talált! A kártya az idővonaladra került.' : 'Nem jó helyre került.'}</b></div>
     <div><b>${song.year}</b> – ${song.artist}: <i>${song.title}</i></div>`;
  save();
  render();
}

function next() {
  if (G.done) { newGame(); return; }
  if (G.round >= ROUNDS) {
    G.done = true;
    const rec = readJSON(recordKey(G.pack || 'hu'));
    G.newRecord = isBetter(G, rec);
    if (G.newRecord) try { localStorage.setItem(recordKey(G.pack || 'hu'), JSON.stringify({ hits: G.hits, elapsed: G.elapsed })); } catch (e) {}
    save();
    render();
    return;
  }
  G.round++;
  drawCard();
  render();
}

function showMenu() {
  if (G && !G.done) save();
  stopSong();
  $('game').classList.add('hidden'); $('setup').classList.remove('hidden');
  $('resumeBtn').classList.toggle('hidden', !load());
  showRecord();
}

function showRecord() {
  const pack = $('packSel').value;
  const rec = readJSON(recordKey(pack));
  $('packInfo').textContent = `${packPool(pack).length} dal, YouTube-ról. Ha egy videó nem indul el, a „Másik dal” gomb újat húz, a kör nem vész el. Az óra akkor indul, amikor a dal megszólal, és a felfedésnél áll meg. A kezdőkártyát kék keret jelöli.`;
  $('record').textContent = rec ? `Rekordod: ${rec.hits}/${ROUNDS}, ${fmt(rec.elapsed)} alatt.` : '';
}

$('timeline').addEventListener('click', e => {
  const slot = e.target.closest('.slot');
  if (!slot) return;
  G.slot = +slot.dataset.slot;
  startClock(); // takarékos: ha a lejátszó állapota nem jön meg (pl. hibás betöltés), legkésőbb a rés kiválasztásakor indul az óra.
  render();
});
$('startBtn').onclick = newGame;
$('resumeBtn').onclick = () => { G = load(); if (G) show(); };
$('revealBtn').onclick = reveal;
$('nextBtn').onclick = next;
$('skipBtn').onclick = () => { tick(); drawCard(); render(); };
$('quitBtn').onclick = showMenu;
$('packSel').onchange = showRecord;
$('packSel').value = readJSON('hitster-pakli') || 'hu';
$('playBtn').onclick = () => {
  if (!player || !player.getPlayerState) return;
  try { player.getPlayerState() === YT.PlayerState.PLAYING ? player.pauseVideo() : player.playVideo(); } catch (e) {}
};
showMenu();

// Ellenőrzés a konzolba: runTests()
function runTests() {
  const c = [{ year: 1980 }, { year: 1990 }];
  console.assert(isCorrect(c, 0, 1975), 'elejére korábbi');
  console.assert(!isCorrect(c, 0, 1985), 'elejére későbbi');
  console.assert(isCorrect(c, 1, 1985), 'közé');
  console.assert(isCorrect(c, 1, 1990), 'azonos év');
  console.assert(isCorrect(c, 2, 2000), 'végére');
  console.assert(!isCorrect(c, 2, 1970), 'végére korábbi');
  console.assert(isBetter({ hits: 7, elapsed: 9e5 }, { hits: 6, elapsed: 1e5 }), 'több találat nyer');
  console.assert(isBetter({ hits: 7, elapsed: 1e5 }, { hits: 7, elapsed: 2e5 }), 'egyenlőnél gyorsabb nyer');
  console.assert(!isBetter({ hits: 7, elapsed: 3e5 }, { hits: 7, elapsed: 2e5 }), 'lassabb nem rekord');
  console.assert(packPool('hu').length === 308 && packPool('int').length === 994, 'pakliméretek');
  console.assert(SONGS.every(s => s.year > 1900 && /^[\w-]{11}$/.test(s.yt) && s.title && s.artist), 'adatok');
  console.assert(new Set(SONGS.map(s => s.n)).size === SONGS.length, 'egyedi azonosítók');
  console.log('Tesztek lefutottak.');
}
</script>
